[project]
name = "ravaya-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.black]
line-length = 99
target-version = ["py312"]

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = [".venv", "staticfiles"]

[tool.ruff.lint]
# E/W style, F bugs, I import order, B common bugs, UP modern syntax, DJ Django, S security
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501", "I001"]  # generated by Django
"**/tests/*" = ["S105", "S106"]       # literal test passwords are fine

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: calls external paid APIs (Gemini). Excluded by default; run with -m live.",
]
